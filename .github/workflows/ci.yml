name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (typage + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          # Valeurs factices : le build n'appelle jamais Supabase.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  billing:
    name: Billing-service (typage + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: billing-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: billing-service/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  sql:
    name: Base de données (migrations + tests RLS et workflows)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Migrations 0001→0008 puis tests
        run: bash supabase/tests/ci/run-tests.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  functions:
    name: Edge Functions (Deno lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint --rules-exclude=no-explicit-any supabase/functions

  secrets:
    name: Aucun secret dans le dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recherche de clés (JWT, clés Gemini / Anthropic, clés sb_secret)
        run: |
          if git grep -nIE 'eyJ[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{15,}|AIza[A-Za-z0-9_-]{30,}|AQ\.Ab8R|sk-ant-[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]+' -- . ':!*package-lock.json'; then
            echo "::error::Une clé semble présente dans le dépôt. Retire-la et régénère-la."
            exit 1
          fi
          echo "OK : aucune clé détectée."
