name: Déploiement des Edge Functions

# Redéploie ai-assistant, forecast-demand et damage-check à chaque modification de supabase/functions/.
# Prérequis (Settings → Secrets and variables → Actions) :
#   secret   SUPABASE_ACCESS_TOKEN   (Supabase → Account → Access Tokens)
#   variable SUPABASE_PROJECT_REF    (ex. nwfzuteyhquajkwjxspb)
# Les secrets GEMINI_API_KEY / GEMINI_MODEL / CRON_SECRET se posent UNE fois avec scripts/setup_ai.ps1.
# Les MIGRATIONS SQL ne sont volontairement pas poussées automatiquement : appliquées à la main dans
# le SQL Editor, elles n'ont pas d'historique côté Supabase et `db push` tenterait de les rejouer.
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF non définis : déploiement ignoré."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.cfg.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
